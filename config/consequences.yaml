# Consequence: the customer-assigned cost of an undetected error on a field.
# It decides how deep the evidence stack goes, through the stopping rule:
# PASS when P(wrong) x consequence < cost of the next check that could change
# the decision.
#
# STATUS: PLACEHOLDER. Every value below was set by Tanner on 2026-09-16 so the
# stopping rule is not blocked, and is to be replaced after the customer
# conversations. Any report that uses these must say so — a consequence we chose
# and a consequence the customer chose support very different claims, and the
# stopping rule is sensitive to them: halving the money multiplier moves fields
# out of Tier 3 and changes measured coverage.

status: placeholder
set_by: tanner
set_on: 2026-09-16
replace_after: customer consequence conversations (one per document source)

defaults:
  money:
    mode: value_multiplier
    multiplier: 1.0
    floor_usd: 25
  identifier:
    mode: policy_constant
    usd: 150
    rationale: a wrong PO/ticket/invoice number misroutes a whole job
  quantity:
    mode: value_multiplier_on_delta
    basis: unit_price_x_quantity_delta
    floor_usd: 25
    fallback_usd: 75          # when unit price is unknown
  date:
    mode: policy_constant
    usd: 40
  party:
    mode: policy_constant
    usd: 60
  text:
    mode: policy_constant
    usd: 5
  line_item:
    mode: inherit_from_components
    note: >-
      A line_item is composite; its consequence is the aggregate of the money
      and quantity fields it contains rather than a constant of its own.

# Per-source overrides, keyed by document source id. Empty until the customer
# conversations happen.
by_source: {}

# --- T5, second clause ---
# "verification + retries <= 10% of the per-page human review cost the customer
# reports". The figure below is a PLACEHOLDER, not a customer report.
#
# Binding rule (Tanner, 2026-09-16): T5's second clause must be reported as
# "pending customer input" and may neither pass nor fail on this number. Any
# report printing a T5 second-clause result computed from a placeholder is a bug.
human_review_cost_per_page_usd:
  _placeholder: 0.90
  _status: placeholder
  _gating: forbidden
  by_source: {}             # real reported figures land here, one per source
