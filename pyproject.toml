[project]
name = "verumetric"
version = "0.0.0"
description = "Machine-only verification and certification for machine-generated document work"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Only tools/download_corpora.py needs this, and only for CORD. It pulls ~100MB
# of transitive dependencies, so it stays out of the default install:
#     uv sync --extra corpora
corpora = [
    "datasets>=2.19",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verumetric"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
